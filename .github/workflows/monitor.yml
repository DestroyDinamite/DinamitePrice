name: Monitor de Preços

on:
  schedule:
    - cron: "*/20 * * * *"   # "vigia": garante que o monitoramento contínuo esteja sempre ligado
  workflow_dispatch:
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [check, add, remove, test-notify, debug, loop]
        default: check
      link:
        description: "Link do produto (para 'add'; vários separados por espaço para 'debug')"
        required: false
      id:
        description: "Id do produto (para 'remove')"
        required: false
      seletor:
        description: "Seletor CSS do preço (opcional, para 'add')"
        required: false

permissions:
  contents: write
  actions: write

env:
  TZ: America/Sao_Paulo
  NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
  SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
  SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
  EMAIL_PARA: ${{ secrets.EMAIL_PARA }}

jobs:
  # Fica ~5h45 rodando e conferindo a cada ~5 min; ao terminar, inicia a próxima rodada.
  continuo:
    if: github.event_name == 'schedule' || github.event.inputs.acao == 'loop'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: monitor-continuo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monitorar continuamente
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          fim=$((SECONDS + 20700))
          while [ $SECONDS -lt $fim ]; do
            inicio=$SECONDS
            git pull -q --rebase origin main || { git rebase --abort 2>/dev/null || true; git reset -q --hard origin/main; }
            echo "::group::$(date '+%d/%m %H:%M') conferência"
            python monitor.py check || echo "falhou, tento de novo na próxima"
            echo "::endgroup::"
            git add produtos.json buscas.json
            if ! git diff --cached --quiet; then
              git commit -qm "Atualiza preços"
              for t in 1 2 3; do
                git pull -q --rebase origin main && git push -q && break
                git rebase --abort 2>/dev/null || true; sleep 5
              done
            fi
            espera=$((300 - (SECONDS - inicio)))
            [ $espera -gt 0 ] && sleep $espera
          done
      - name: Iniciar a próxima rodada
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" -f acao=loop

  # Ações manuais: add, remove, check, test-notify, debug
  manual:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.acao != 'loop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: monitor-manual
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executar
        env:
          ACAO: ${{ github.event.inputs.acao }}
          LINK: ${{ github.event.inputs.link }}
          PID: ${{ github.event.inputs.id }}
          SELETOR: ${{ github.event.inputs.seletor }}
        run: |
          case "$ACAO" in
            add)    if [ -n "$SELETOR" ]; then python monitor.py add "$LINK" --seletor "$SELETOR"; else python monitor.py add "$LINK"; fi ;;
            remove) python monitor.py remove "$PID" ;;
            debug)  python monitor.py debug $LINK ;;
            *)      python monitor.py "$ACAO" ;;
          esac
      - name: Salvar
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add produtos.json buscas.json
          git diff --cached --quiet && exit 0
          git commit -qm "Atualiza lista/preços"
          for t in 1 2 3; do git pull -q --rebase origin main && git push -q && break; git rebase --abort 2>/dev/null || true; sleep 5; done

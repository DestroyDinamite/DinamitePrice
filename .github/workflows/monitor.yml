name: Monitor de Preços

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos, 24h por dia
  workflow_dispatch:         # permite rodar/adicionar link manualmente pelo site/app do GitHub
    inputs:
      acao:
        description: "O que fazer"
        type: choice
        options: [check, add, remove, test-notify]
        default: check
      link:
        description: "Link do produto (para 'add')"
        required: false
      id:
        description: "Id do produto (para 'remove')"
        required: false
      seletor:
        description: "Seletor CSS do preço (opcional, para 'add')"
        required: false

concurrency:
  group: monitor-precos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORTA: ${{ secrets.SMTP_PORTA }}
      SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
      SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
      EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Executar
        env:
          ACAO: ${{ github.event.inputs.acao || 'check' }}
          LINK: ${{ github.event.inputs.link }}
          PID: ${{ github.event.inputs.id }}
          SELETOR: ${{ github.event.inputs.seletor }}
        run: |
          case "$ACAO" in
            add)    if [ -n "$SELETOR" ]; then python monitor.py add "$LINK" --seletor "$SELETOR"; else python monitor.py add "$LINK"; fi ;;
            remove) python monitor.py remove "$PID" ;;
            *)      python monitor.py "$ACAO" ;;
          esac

      - name: Salvar preços
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add produtos.json
          git diff --cached --quiet || (git commit -m "Atualiza preços" && git push)
